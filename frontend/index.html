<!doctype html>
<html lang="en" class="dark" style="background-color: #000000;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/tab_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Green Glide Logistics</title>
  <!-- Inline script to guarantee 0ms theme flashing on mobile reload -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.style.backgroundColor = '#EAEBED';
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.style.backgroundColor = '#000000';
      }
    })();
  </script>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body class="bg-black text-slate-50 font-sans transition-colors duration-200"
  style="background-color: #000000; margin: 0; padding: 0;">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
